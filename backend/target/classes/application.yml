server:
  port: 8080

spring:
  application:
    name: pet-adoption-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pet_adoption?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# JWT 配置（短期令牌 + Redis 黑名单吊销）
jwt:
  secret: pet-adoption-platform-jwt-secret-key-2026-please-change
  expire-hours: 2

# AES 加密配置（敏感字段加密，密钥需 16 字节）
security:
  aes-key: PetAdoptAESKey16

# LangChain4j AI Agent 配置（通义千问 Qwen，OpenAI 兼容网关）
langchain4j:
  open-ai:
    chat-model:
      base-url: https://maas.qianwenaiapi.com/compatible-mode/v1
      api-key: ${QWEN_API_KEY:sk-your-api-key-here}
      model-name: qwen3.8-flash
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://maas.qianwenaiapi.com/compatible-mode/v1
      api-key: ${QWEN_API_KEY:sk-your-api-key-here}
      model-name: qwen3.8-flash
      log-requests: true
      log-responses: true

logging:
  level:
    com.petadopt: info
    dev.langchain4j: warn
